# Build the Astro site and deploy it to GitHub Pages on every push to master.
# Repository settings: Pages > Source must be "GitHub Actions".
# Analytics: set the repository variable UMAMI_WEBSITE_ID (Settings > Secrets and variables >
# Actions > Variables) to the Umami Cloud website id. Without it the site builds with no analytics.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: each page's sitemap lastmod is the date of its last commit.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Encoded images (AVIF is slow to encode), restored after npm ci, which clears node_modules.
      # Astro names each entry by its source and settings, so an older cache only adds misses.
      - name: Image cache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/content/**/*.webp', 'src/content/**/*.png', 'src/content/**/*.jpg', 'package-lock.json') }}
          restore-keys: astro-assets-
      - name: Build
        run: npm run build
        env:
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
